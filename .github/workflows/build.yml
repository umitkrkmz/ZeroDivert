name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      # WinDivert.dll / WinDivert64.sys are committed in src/ZeroDivert.Driver,
      # so no placeholder binaries are needed. The tests never touch the driver.
      - name: Restore
        run: dotnet restore ZeroDivert.slnx

      - name: Build
        run: dotnet build ZeroDivert.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/ZeroDivert.Tests/ZeroDivert.Tests.csproj --configuration Release --no-build --verbosity normal
